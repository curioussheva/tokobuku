name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_SW_ENABLED: "true"

jobs:
  build:
    name: Build all apps
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The storefront's next.config.js hard-fails without a publishable key,
      # and the backend must build before the storefront anyway (its type
      # generation can depend on compiled backend output), so build backend
      # first, create a key, then feed it into the storefront build.
      - name: Build backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:7001,http://localhost:9000
          AUTH_CORS: http://localhost:7001,http://localhost:9000
          MEDUSA_ADMIN_ONBOARDING_TYPE: nextjs
        run: pnpm run build

      - name: Migrate database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
        run: pnpm exec medusa db:migrate

      - name: Seed backend
        id: pk
        # The storefront statically renders pages at build time and calls the
        # store API, which needs a valid publishable key linked to a sales
        # channel plus a region. Seed all of it through the official Medusa
        # workflows so the link tables are populated correctly.
        # NOTE: medusa exec resolves the script path through its own loader,
        # which breaks under a job working-directory, so cd and use an
        # absolute path.
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
        run: |
          SCRIPT="$GITHUB_WORKSPACE/apps/backend/scripts/seed-ci.js"
          if ! pnpm exec medusa exec "$SCRIPT" > seed.log 2>&1; then
            echo "--- seed-ci failed, log follows ---"
            cat seed.log
            exit 1
          fi
          # The script writes the token to ./scripts/seed-key.txt because
          # medusa appends its own log lines to stdout after the script runs,
          # which makes a last-line grab unreliable.
          KEY_FILE="$GITHUB_WORKSPACE/apps/backend/scripts/seed-key.txt"
          if [ ! -s "$KEY_FILE" ]; then
            echo "--- no publishable key file produced ---"
            cat seed.log
            exit 1
          fi
          KEY=$(tr -d '\r\n' < "$KEY_FILE")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # The storefront's static rendering calls the store API; without a live
      # backend those calls fail with ECONNREFUSED and the build dies on
      # page-data collection. Start the backend and wait for it to be healthy.
      - name: Start backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:7001,http://localhost:9000
          AUTH_CORS: http://localhost:7001,http://localhost:9000
        run: |
          pnpm run start > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          tail -30 backend.log
          exit 1

      - name: Build storefront
        working-directory: apps/storefront
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ steps.pk.outputs.key }}
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        run: pnpm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          if-no-files-found: warn

      - name: Upload storefront build
        uses: actions/upload-artifact@v4
        with:
          name: storefront-dotnext
          path: |
            apps/storefront/.next
            apps/storefront/public
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        working-directory: apps/backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
