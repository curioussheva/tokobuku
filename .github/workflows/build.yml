name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_SW_ENABLED: "true"

jobs:
  build:
    name: Build all apps
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The storefront's next.config.js hard-fails without a publishable key,
      # and the backend must build before the storefront anyway (its type
      # generation can depend on compiled backend output), so build backend
      # first, create a key, then feed it into the storefront build.
      - name: Build backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:7001,http://localhost:9000
          AUTH_CORS: http://localhost:7001,http://localhost:9000
          MEDUSA_ADMIN_ONBOARDING_TYPE: nextjs
        run: pnpm run build

      - name: Migrate database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
        run: pnpm exec medusa db:migrate

      - name: Create publishable API key
        id: pk
        # medusa exec resolves the script path through its own loader, which
        # breaks under a job working-directory ("paths[1] argument must be of
        # type string"). The key is a single row insert, so do it in SQL and
        # read the token back — no script loader involved.
        # Idempotent: existing publishable keys are reused.
        env:
          PGPASSWORD: postgres
        run: |
          KEY=$(psql -h localhost -U postgres -d medusa_store -tAc "
            INSERT INTO api_key (id, token, type, title, created_by, created_at, updated_at)
            SELECT replace(gen_random_uuid()::text, '-', ''),
                   'pk_ci_' || replace(gen_random_uuid()::text, '-', ''),
                   'publishable', 'storefront', 'ci', now(), now()
            WHERE NOT EXISTS (SELECT 1 FROM api_key WHERE type = 'publishable')
            ON CONFLICT DO NOTHING;

            SELECT token FROM api_key WHERE type = 'publishable' ORDER BY created_at LIMIT 1;
          " | tr -d '\r\n')

          if [ -n "$KEY" ]; then
            echo "key=$KEY" >> "$GITHUB_OUTPUT"
          else
            echo "key=pk_ci_placeholder" >> "$GITHUB_OUTPUT"
          fi

      # The storefront statically renders pages at build time, which calls the
      # store API. Without a running backend those calls fail with
      # ECONNREFUSED and the build dies on page-data collection. Start the
      # backend in the background and wait for it to accept connections.
      - name: Start backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_store
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:7001,http://localhost:9000
          AUTH_CORS: http://localhost:7001,http://localhost:9000
        run: |
          pnpm run start > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          tail -30 backend.log
          exit 1

      # A seeded region is required for the storefront's locale/region
      # resolution during static generation.
      - name: Seed region
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d medusa_store -tAc "
            INSERT INTO region (id, name, currency_code, automatic_taxes, created_at, updated_at)
            SELECT 'reg_' || replace(gen_random_uuid()::text, '-', ''), 'Indonesia', 'idr', false, now(), now()
            WHERE NOT EXISTS (SELECT 1 FROM region)
            ON CONFLICT DO NOTHING;
          "

      - name: Build storefront
        working-directory: apps/storefront
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ steps.pk.outputs.key }}
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        run: pnpm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          if-no-files-found: warn

      - name: Upload storefront build
        uses: actions/upload-artifact@v4
        with:
          name: storefront-dotnext
          path: |
            apps/storefront/.next
            apps/storefront/public
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        working-directory: apps/backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
